[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the backend on Render. Netlify makes the request
# server-side, so the browser only ever talks to its own origin and no CORS
# headers are needed on the backend.
[[redirects]]
  from = "/api/*"
  to = "https://baristabackend.onrender.com/:splat"
  status = 200
  force = true

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
